name: Build YouBili APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install SDK packages
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unzip and fix project
        id: unzip
        run: |
          if [ -f YouBili-Android-fixed.zip ]; then
            ZIP=YouBili-Android-fixed.zip
          elif [ -f YouBili-Android-mobile-cloud-build.zip ]; then
            ZIP=YouBili-Android-mobile-cloud-build.zip
          else
            echo "找不到项目压缩包"
            ls -la
            exit 1
          fi
          echo "使用压缩包: $ZIP"
          unzip -q "$ZIP" -d extracted

          if [ -f extracted/YouBili-Android/settings.gradle.kts ]; then
            DIR="extracted/YouBili-Android"
          elif [ -f extracted/settings.gradle.kts ]; then
            DIR="extracted"
          else
            echo "解压后找不到 settings.gradle.kts"
            find extracted -name "settings.gradle.kts" || true
            exit 1
          fi
          echo "项目目录: $DIR"
          echo "dir=$DIR" >> $GITHUB_OUTPUT

          # 修复 JVM target 不匹配问题
          cat > "$DIR/app/build.gradle.kts" << 'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }
          android {
              namespace = "com.youbili.app"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.youbili.app"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = 1
                  versionName = "0.1.0"
              }
              buildFeatures { compose = true }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.12.01"))
              implementation("androidx.activity:activity-compose:1.10.0")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material:1.7.6")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")
              implementation("io.coil-kt:coil-compose:2.7.0")
              implementation("androidx.webkit:webkit:1.12.1")
              debugImplementation("androidx.compose.ui:ui-tooling")
          }
          EOF
          echo "已修复 app/build.gradle.kts"

      - name: Build debug APK
        working-directory: ${{ steps.unzip.outputs.dir }}
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YouBili-debug-apk
          path: ${{ steps.unzip.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
