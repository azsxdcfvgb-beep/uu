name: Build YouBili APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install SDK packages
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unzip project
        run: |
          if [ -f YouBili-Android-fixed.zip ]; then
            ZIP=YouBili-Android-fixed.zip
          elif [ -f YouBili-Android-mobile-cloud-build.zip ]; then
            ZIP=YouBili-Android-mobile-cloud-build.zip
          else
            echo "找不到项目压缩包"
            ls -la
            exit 1
          fi
          echo "使用压缩包: $ZIP"
          unzip -q "$ZIP" -d extracted
          if [ -f extracted/YouBili-Android/settings.gradle.kts ]; then
            echo "PROJECT_DIR=extracted/YouBili-Android" >> $GITHUB_ENV
          elif [ -f extracted/settings.gradle.kts ]; then
            echo "PROJECT_DIR=extracted" >> $GITHUB_ENV
          else
            echo "解压后找不到项目"
            find extracted -name "settings.gradle.kts" || true
            exit 1
          fi
          echo "项目目录: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YouBili-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
